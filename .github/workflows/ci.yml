name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      # В CI модель эмбеддингов не скачиваем: тесты идут на TF-IDF (это же задаёт tests/conftest.py)
      LDR_EMBED_BACKEND: tfidf
      # Windows: консоль cp1252 не печатает кириллицу — принудительно UTF-8
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Установка зависимостей
        run: python -m pip install -r requirements.txt
      - name: Корпус воспроизводим генератором
        shell: bash
        run: |
          python data/synthetic/make_synthetic.py --out regen_tmp/docs
          python - <<'EOF'
          # PDF сравниваем только по наличию: без шрифта с кириллицей генератор пишет протокол в .md
          import pathlib
          A, B = pathlib.Path("data/synthetic/docs"), pathlib.Path("regen_tmp/docs")
          stem = lambda p, root: p.relative_to(root).with_suffix("").as_posix()
          a = sorted(stem(p, A) for p in A.rglob("*") if p.is_file())
          b = sorted(stem(p, B) for p in B.rglob("*") if p.is_file())
          assert a == b, "состав корпуса отличается от генератора"
          n = 0
          for p in A.rglob("*"):
              if p.suffix in (".md", ".txt"):
                  assert p.read_text(encoding="utf-8") == (B / p.relative_to(A)).read_text(encoding="utf-8"), p
                  n += 1
          print("ok:", len(a), "документов, текстовых совпало:", n)
          EOF
      - name: pytest
        run: python -m pytest -q
