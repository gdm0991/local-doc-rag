[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-doc-rag"
version = "0.1.0"
description = "Офлайн-поиск по инженерной документации: BM25 + векторы + RRF, ответ локальной моделью"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dmitry Gruzdev" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "pydantic>=2.5",
    "pypdf>=3.17",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "snowballstemmer>=2.2",
    "fastembed>=0.4",
]

[project.optional-dependencies]
llm = ["llama-cpp-python>=0.2.80"]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.0"]

[project.scripts]
ldr = "local_doc_rag.cli:app"

[tool.setuptools]
packages = ["local_doc_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
